name: OPM Plugin Check

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  opm_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/opm-check.yml@f81c5158260a0f9b21c9d8fbf2a83fa466df89f6
    with:
      python_version: '3.11'
      plugin_type: 'auto'
      entry_point: 'ovos-rake-keyword-extractor'
      opm_require_found: true
      opm_validate_interface: true
      opm_test_import: true
      opm_perf_threshold_ms: 500
