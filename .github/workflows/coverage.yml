name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@f81c5158260a0f9b21c9d8fbf2a83fa466df89f6
    with:
      python_version: '3.11'
      coverage_source: 'RAKEkeywords'
      test_path: 'test/'
      install_extras: ''
      min_coverage: 0
